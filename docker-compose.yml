services:
  db:
    image: postgres:16
    container_name: listz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: listz
      POSTGRES_PASSWORD: listz_password
      POSTGRES_DB: listz
    ports:
      - "5433:5432"
    volumes:
      - listz_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U listz -d listz"]
      interval: 5s
      timeout: 3s
      retries: 10
  adminer:
    image: adminer
    container_name: listz-adminer
    restart: unless-stopped
    ports:
      - 8080:8080

volumes:
  listz_pgdata:
